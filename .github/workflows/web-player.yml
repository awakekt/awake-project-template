name: Web player release

# Builds this template's web app with an empty project folder for an Awake Core version and
# attaches it to the release `player-<core>` as web-player.zip. Awake Studio's "Export Web App"
# downloads it and puts the user's project in `project/`.
#
# Runs daily for the newest Core on Maven Central, building only if that version has no player yet,
# and on demand for any version. Every run also mirrors all players to this repo's GitHub Pages
# (player/<core>/web-player.zip): release downloads send no CORS headers, so Studio running in a
# browser fetches the Pages copy.
#
# The WebGPU backend is the <core>-SNAPSHOT of the same Core release: the build Core's tag run
# publishes from the release once it publishes one, otherwise the last main build before the cut.
# A scheduled run whose Core has no such build yet skips the build and tries again the next day. Any
# other failed check, such as a build that names another Core, fails the run, and so does a manual
# run that finds no build.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      core:
        description: 'Awake Core version (blank: newest on Maven Central)'
        required: false
      vulkan:
        description: 'Awake Vulkan version (blank: newest on Maven Central)'
        required: false
      webgpu:
        description: 'Awake WebGPU version (blank: <core>-SNAPSHOT, the WebGPU snapshot of that Core release; never the next patch)'
        required: false
      rebuild:
        description: 'Rebuild even if the release exists'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-player
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.v.outputs.core }}
      vulkan: ${{ steps.v.outputs.vulkan }}
      webgpu: ${{ steps.v.outputs.webgpu }}
      webgpu_build: ${{ steps.v.outputs.webgpu_build }}
      strict: ${{ steps.v.outputs.strict }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Pick the versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          IN_CORE: ${{ inputs.core }}
          IN_VULKAN: ${{ inputs.vulkan }}
          IN_WEBGPU: ${{ inputs.webgpu }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          central=https://repo1.maven.org/maven2/com/awakekt/awake
          newest() { curl -fsS "$central/$1/maven-metadata.xml" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p'; }
          core=${IN_CORE:-$(newest project)}
          vulkan=${IN_VULKAN:-$(newest backend/vulkan)}
          # WebGPU isn't released to Maven Central. Pin <core>-SNAPSHOT, the WebGPU snapshot of that
          # release: from Core's tag run once it publishes one, otherwise the last main build before
          # the cut. Never the next patch, which is Core main after the release. A Core snapshot pairs
          # with the same snapshot.
          if [[ "$core" == *-SNAPSHOT ]]; then webgpu=${IN_WEBGPU:-$core}; else webgpu=${IN_WEBGPU:-$core-SNAPSHOT}; fi
          build=true
          if gh release view "player-$core" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [[ "$REBUILD" != true ]]; then build=false; fi
          strict=false
          webgpu_build=
          if [[ "$build" == true ]]; then
            # Waiting a day helps only when the build is not published yet (exit 3). A build of
            # another Core or an unreachable Central fails the run, so a wrong pin is not skipped
            # quietly every day.
            check=0
            pin=$(bash .github/scripts/check-webgpu-pin.sh "$core" "$webgpu") || check=$?
            if [[ "$check" -eq 0 ]]; then
              strict=$(sed -n 's/^strict=//p' <<< "$pin")
              webgpu_build=$(sed -n 's/^build=//p' <<< "$pin")
            elif [[ "$check" -eq 3 && "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "::warning::WebGPU $webgpu for Core $core is not published yet; tomorrow's run tries again."
              build=false
            else
              exit 1
            fi
          fi
          echo "core=$core vulkan=$vulkan webgpu=$webgpu webgpu_build=$webgpu_build strict=$strict build=$build"
          {
            echo "core=$core"; echo "vulkan=$vulkan"; echo "webgpu=$webgpu"; echo "webgpu_build=$webgpu_build"
            echo "strict=$strict"; echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin the Awake versions
        env:
          CORE: ${{ needs.resolve.outputs.core }}
          VULKAN: ${{ needs.resolve.outputs.vulkan }}
          WEBGPU: ${{ needs.resolve.outputs.webgpu }}
        run: |
          catalog=gradle/libs.versions.toml
          sed -i "s/^awake = \".*\"/awake = \"$CORE\"/; s/^awake-vulkan = \".*\"/awake-vulkan = \"$VULKAN\"/" "$catalog"
          if grep -q '^awake-webgpu = ' "$catalog"; then
            sed -i "s/^awake-webgpu = \".*\"/awake-webgpu = \"$WEBGPU\"/" "$catalog"
          else
            sed -i "s/^\(awake-vulkan = \".*\"\)$/\1\nawake-webgpu = \"$WEBGPU\"/" "$catalog"
            sed -i 's/^\(awake-backend-webgpu = {.*version.ref = \)"awake"/\1"awake-webgpu"/' "$catalog"
          fi
          grep -E '^awake|backend-webgpu' "$catalog"

      # Every Awake module the web app runs must be the Core it is built for. A WebGPU build that
      # predates Core's release pin may still bring its Core edges at <core>-SNAPSHOT.
      - name: Check the resolved Awake versions
        env:
          CORE: ${{ needs.resolve.outputs.core }}
          STRICT: ${{ needs.resolve.outputs.strict }}
        run: |
          ./gradlew -q :app:webApp:dependencies --configuration wasmJsRuntimeClasspath --no-configuration-cache > classpath.txt
          if grep -E 'com\.awakekt\.awake[^ ]* FAILED' classpath.txt; then
            echo "::error::Some Awake modules did not resolve."
            exit 1
          fi
          # After the tree prefix, a line reads group:module:requested, then "-> selected" when they differ.
          selected=$(awk '/com\.awakekt\.awake/ {
              line = $0; sub(/^[^a-z]*/, "", line)
              if (line !~ /^com\.awakekt\.awake/) next
              split(line, c, ":"); coordinate = c[1] ":" c[2]; sub(/ .*/, "", coordinate)
              if ((i = index(line, " -> ")) > 0) version = substr(line, i + 4); else version = c[3]
              sub(/ .*/, "", version)
              print coordinate ":" version
            }' classpath.txt | grep -vE '^com\.awakekt\.awake\.backend:webgpu' | sort -u)
          if [[ -z "$selected" ]]; then
            echo "::error::Found no Awake modules in the web app's runtime classpath."
            exit 1
          fi
          echo "$selected"
          wrong=$(awk -F: -v core="$CORE" '$3 != core' <<< "$selected")
          if [[ "$STRICT" != true && "$CORE" != *-SNAPSHOT ]]; then
            snapshots=$(awk -F: -v core="$CORE" '$3 == core "-SNAPSHOT"' <<< "$wrong")
            if [[ -n "$snapshots" ]]; then
              echo "::warning::WebGPU predates Core's release pin, so these resolve at $CORE-SNAPSHOT:"
              echo "$snapshots"
            fi
            wrong=$(awk -F: -v core="$CORE" '$3 != core "-SNAPSHOT"' <<< "$wrong")
          fi
          if [[ -n "$wrong" ]]; then
            echo "::error::The web app resolves Awake modules other than Core $CORE:"
            echo "$wrong"
            exit 1
          fi

      # Studio adds the user's project; the player ships without the sample. The distribution links
      # the production executable, so the log reports any WebGPU call into Core code missing here.
      - name: Build the web player
        run: |
          rm -rf app/shared/src/commonMain/resources/project
          ./gradlew :app:webApp:wasmJsBrowserDistribution --no-configuration-cache

      # Stored, not deflated: Studio's web build reads stored zips only. No source maps.
      - name: Package
        run: |
          cd app/webApp/build/dist/wasmJs/productionExecutable
          rm -f ./*.map
          zip -q -0 -X -r "$GITHUB_WORKSPACE/web-player.zip" .
          ls -la "$GITHUB_WORKSPACE/web-player.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ needs.resolve.outputs.core }}
          VULKAN: ${{ needs.resolve.outputs.vulkan }}
          WEBGPU: ${{ needs.resolve.outputs.webgpu }}
          WEBGPU_BUILD: ${{ needs.resolve.outputs.webgpu_build }}
        run: |
          tag="player-$CORE"
          notes="Web player for Awake Core $CORE, Vulkan $VULKAN and WebGPU $WEBGPU (build $WEBGPU_BUILD), built from $GITHUB_SHA. Awake Studio's Export Web App downloads it."
          # A rebuild replaces the zip, so its notes name the builds it now carries.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" web-player.zip --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" web-player.zip --title "Web player for Awake Core $CORE" --notes "$notes"
          fi

  pages:
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Collect every player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/player
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep '^player-'); do
            core=${tag#player-}
            mkdir -p "site/player/$core"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-player.zip --dir "site/player/$core"
          done
          {
            echo '<!DOCTYPE html><meta charset="utf-8"><title>Awake web players</title>'
            echo '<p>Web players for Awake Studio'"'"'s Export Web App, one per Awake Core version.</p><ul>'
            for dir in site/player/*/; do v=$(basename "$dir"); echo "<li><a href=\"player/$v/web-player.zip\">$v</a></li>"; done
            echo '</ul>'
          } > site/index.html
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
