name: Web player release

# Builds this template's prebuilt players without the sample project for an Awake Core version and
# attaches them to the release `player-<core>`:
# - web-player.zip (mirrored to GitHub Pages player/<core>/web-player.zip for browser CORS)
# - android-player.apk (unsigned base release APK for Studio's Export Android APK)
# - macos-arm64-player.zip (self-contained Apple Silicon .app player for Studio's Export Desktop App)
#
# Runs daily for the newest Core on Maven Central, building only if that version is missing any
# player asset, and on demand for any version.
#
# The WebGPU backend is the <core>-SNAPSHOT of the same Core release: the build Core's tag run
# publishes from the release once it publishes one, otherwise the last main build before the cut.
# A scheduled run whose Core has no such build yet skips the build and tries again the next day. Any
# other failed check, such as a build that names another Core, fails the run, and so does a manual
# run that finds no build.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      core:
        description: 'Awake Core version (blank: newest on Maven Central)'
        required: false
      vulkan:
        description: 'Awake Vulkan version (blank: newest on Maven Central)'
        required: false
      webgpu:
        description: 'Awake WebGPU version (blank: <core>-SNAPSHOT, the WebGPU snapshot of that Core release; never the next patch)'
        required: false
      rebuild:
        description: 'Rebuild even if the release exists'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web-player
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.v.outputs.core }}
      vulkan: ${{ steps.v.outputs.vulkan }}
      webgpu: ${{ steps.v.outputs.webgpu }}
      webgpu_build: ${{ steps.v.outputs.webgpu_build }}
      strict: ${{ steps.v.outputs.strict }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Pick the versions
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          IN_CORE: ${{ inputs.core }}
          IN_VULKAN: ${{ inputs.vulkan }}
          IN_WEBGPU: ${{ inputs.webgpu }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          central=https://repo1.maven.org/maven2/com/awakekt/awake
          newest() { curl -fsS "$central/$1/maven-metadata.xml" | sed -n 's:.*<release>\(.*\)</release>.*:\1:p'; }
          core=${IN_CORE:-$(newest project)}
          vulkan=${IN_VULKAN:-$(newest backend/vulkan)}
          # WebGPU isn't released to Maven Central. Pin <core>-SNAPSHOT, the WebGPU snapshot of that
          # release: from Core's tag run once it publishes one, otherwise the last main build before
          # the cut. Never the next patch, which is Core main after the release. A Core snapshot pairs
          # with the same snapshot.
          if [[ "$core" == *-SNAPSHOT ]]; then webgpu=${IN_WEBGPU:-$core}; else webgpu=${IN_WEBGPU:-$core-SNAPSHOT}; fi
          build=true
          if [[ "$REBUILD" != true ]]; then
            assets=$(gh release view "player-$core" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
            if grep -qx 'web-player.zip' <<< "$assets" \
              && grep -qx 'android-player.apk' <<< "$assets" \
              && grep -qx 'macos-arm64-player.zip' <<< "$assets"; then
              build=false
            fi
          fi
          strict=false
          webgpu_build=
          if [[ "$build" == true ]]; then
            # Waiting a day helps only when the build is not published yet (exit 3). A build of
            # another Core or an unreachable Central fails the run, so a wrong pin is not skipped
            # quietly every day.
            check=0
            pin=$(bash .github/scripts/check-webgpu-pin.sh "$core" "$webgpu") || check=$?
            if [[ "$check" -eq 0 ]]; then
              strict=$(sed -n 's/^strict=//p' <<< "$pin")
              webgpu_build=$(sed -n 's/^build=//p' <<< "$pin")
            elif [[ "$check" -eq 3 && "$GITHUB_EVENT_NAME" == schedule ]]; then
              echo "::warning::WebGPU $webgpu for Core $core is not published yet; tomorrow's run tries again."
              build=false
            else
              exit 1
            fi
          fi
          echo "core=$core vulkan=$vulkan webgpu=$webgpu webgpu_build=$webgpu_build strict=$strict build=$build"
          {
            echo "core=$core"; echo "vulkan=$vulkan"; echo "webgpu=$webgpu"; echo "webgpu_build=$webgpu_build"
            echo "strict=$strict"; echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build web player
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin the Awake versions
        env:
          CORE: ${{ needs.resolve.outputs.core }}
          VULKAN: ${{ needs.resolve.outputs.vulkan }}
          WEBGPU: ${{ needs.resolve.outputs.webgpu }}
        run: |
          catalog=gradle/libs.versions.toml
          sed -i "s/^awake = \".*\"/awake = \"$CORE\"/; s/^awake-vulkan = \".*\"/awake-vulkan = \"$VULKAN\"/" "$catalog"
          if grep -q '^awake-webgpu = ' "$catalog"; then
            sed -i "s/^awake-webgpu = \".*\"/awake-webgpu = \"$WEBGPU\"/" "$catalog"
          else
            sed -i "s/^\(awake-vulkan = \".*\"\)$/\1\nawake-webgpu = \"$WEBGPU\"/" "$catalog"
            sed -i 's/^\(awake-backend-webgpu = {.*version.ref = \)"awake"/\1"awake-webgpu"/' "$catalog"
          fi
          grep -E '^awake|backend-webgpu' "$catalog"

      # Every Awake module the web app runs must be the Core it is built for. A WebGPU build that
      # predates Core's release pin may still bring its Core edges at <core>-SNAPSHOT.
      - name: Check the resolved Awake versions
        env:
          CORE: ${{ needs.resolve.outputs.core }}
          STRICT: ${{ needs.resolve.outputs.strict }}
        run: |
          ./gradlew -q :app:webApp:dependencies --configuration wasmJsRuntimeClasspath --no-configuration-cache > classpath.txt
          if grep -E 'com\.awakekt\.awake[^ ]* FAILED' classpath.txt; then
            echo "::error::Some Awake modules did not resolve."
            exit 1
          fi
          # After the tree prefix, a line reads group:module:requested, then "-> selected" when they differ.
          selected=$(awk '/com\.awakekt\.awake/ {
              line = $0; sub(/^[^a-z]*/, "", line)
              if (line !~ /^com\.awakekt\.awake/) next
              split(line, c, ":"); coordinate = c[1] ":" c[2]; sub(/ .*/, "", coordinate)
              if ((i = index(line, " -> ")) > 0) version = substr(line, i + 4); else version = c[3]
              sub(/ .*/, "", version)
              print coordinate ":" version
            }' classpath.txt | grep -vE '^com\.awakekt\.awake\.backend:webgpu' | sort -u)
          if [[ -z "$selected" ]]; then
            echo "::error::Found no Awake modules in the web app's runtime classpath."
            exit 1
          fi
          echo "$selected"
          wrong=$(awk -F: -v core="$CORE" '$3 != core' <<< "$selected")
          if [[ "$STRICT" != true && "$CORE" != *-SNAPSHOT ]]; then
            snapshots=$(awk -F: -v core="$CORE" '$3 == core "-SNAPSHOT"' <<< "$wrong")
            if [[ -n "$snapshots" ]]; then
              echo "::warning::WebGPU predates Core's release pin, so these resolve at $CORE-SNAPSHOT:"
              echo "$snapshots"
            fi
            wrong=$(awk -F: -v core="$CORE" '$3 != core "-SNAPSHOT"' <<< "$wrong")
          fi
          if [[ -n "$wrong" ]]; then
            echo "::error::The web app resolves Awake modules other than Core $CORE:"
            echo "$wrong"
            exit 1
          fi

      # Studio adds the user's project; the player ships without the sample. The distribution links
      # the production executable, strips WASM debug sections + source maps, emits Cloudflare Pages
      # security _headers, and verifies release hygiene via com.awakekt.release-guard.
      - name: Build, harden and audit the web player
        run: |
          rm -rf app/shared/src/commonMain/resources/project
          ./gradlew :app:webApp:hardenWebBundle :app:webApp:verifyReleaseGuard --no-configuration-cache

      # Stored, not deflated: Studio's web build reads stored zips only. Already hardened and audited.
      - name: Package
        run: |
          cd app/webApp/build/release-guard/web-hardened
          zip -q -0 -X -r "$GITHUB_WORKSPACE/web-player.zip" .
          ls -la "$GITHUB_WORKSPACE/web-player.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: web-player
          path: web-player.zip
          retention-days: 1

  build-android:
    name: Build Android player
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin the Awake versions
        env:
          CORE: ${{ needs.resolve.outputs.core }}
          VULKAN: ${{ needs.resolve.outputs.vulkan }}
        run: |
          catalog=gradle/libs.versions.toml
          sed -i "s/^awake = \".*\"/awake = \"$CORE\"/; s/^awake-vulkan = \".*\"/awake-vulkan = \"$VULKAN\"/" "$catalog"
          grep -E '^awake' "$catalog"

      # Remove the sample project and adaptive icon XML so Android 8+ uses the density PNG icons
      # Studio patches in-place; disable resource path shortening so mipmap paths stay canonical.
      - name: Build Android player APK
        run: |
          rm -rf app/shared/src/commonMain/resources/project
          rm -rf app/androidApp/src/main/res/mipmap-anydpi-v26
          ./gradlew :app:androidApp:assembleRelease -Pandroid.enableResourceOptimizations=false --no-configuration-cache

      - name: Package unsigned base APK
        run: |
          src="app/androidApp/build/outputs/apk/release/androidApp-release.apk"
          test -f "$src"
          cp "$src" "$GITHUB_WORKSPACE/android-player.apk"
          # Strip debug signing entries so Studio signs cleanly with apksig.
          zip -q -d "$GITHUB_WORKSPACE/android-player.apk" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || true
          unzip -l "$GITHUB_WORKSPACE/android-player.apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$GITHUB_WORKSPACE/android-player.apk" | grep -qE 'res/mipmap-xxxhdpi[^/]*/ic_launcher\.png'
          ls -lh "$GITHUB_WORKSPACE/android-player.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-player
          path: android-player.apk
          retention-days: 1

  build-macos:
    name: Build macOS (Apple silicon) player
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pin the Awake versions
        env:
          CORE: ${{ needs.resolve.outputs.core }}
          VULKAN: ${{ needs.resolve.outputs.vulkan }}
        run: |
          catalog=gradle/libs.versions.toml
          sed -i '' "s/^awake = \".*\"/awake = \"$CORE\"/; s/^awake-vulkan = \".*\"/awake-vulkan = \"$VULKAN\"/" "$catalog"
          grep -E '^awake' "$catalog"

      - name: Install Vulkan loader, MoltenVK and GLFW
        run: brew install vulkan-loader molten-vk glfw

      - name: Package macOS player
        run: bash scripts/package-macos-player.sh "$GITHUB_WORKSPACE/macos-arm64-player.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-player
          path: macos-arm64-player.zip
          retention-days: 1

  publish:
    name: Publish player release
    needs: [resolve, build, build-android, build-macos]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-player
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android-player
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-player
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          CORE: ${{ needs.resolve.outputs.core }}
          VULKAN: ${{ needs.resolve.outputs.vulkan }}
          WEBGPU: ${{ needs.resolve.outputs.webgpu }}
          WEBGPU_BUILD: ${{ needs.resolve.outputs.webgpu_build }}
        run: |
          tag="player-$CORE"
          notes="Prebuilt players (web, Android APK, macOS arm64) for Awake Core $CORE, Vulkan $VULKAN and WebGPU $WEBGPU (build $WEBGPU_BUILD), built from $GITHUB_SHA. Awake Studio downloads them on export."
          assets=(dist/web-player.zip dist/android-player.apk dist/macos-arm64-player.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" --title "Players for Awake Core $CORE" --notes "$notes"
          fi

  pages:
    needs: [resolve, publish]
    if: always() && needs.resolve.result == 'success' && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Collect every player
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/player
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' | grep '^player-'); do
            core=${tag#player-}
            mkdir -p "site/player/$core"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern web-player.zip --dir "site/player/$core"
          done
          {
            echo '<!DOCTYPE html><meta charset="utf-8"><title>Awake web players</title>'
            echo '<p>Web players for Awake Studio'"'"'s Export Web App, one per Awake Core version.</p><ul>'
            for dir in site/player/*/; do v=$(basename "$dir"); echo "<li><a href=\"player/$v/web-player.zip\">$v</a></li>"; done
            echo '</ul>'
          } > site/index.html
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Wait for Pages artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 15); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [[ "$count" -ge 1 ]]; then
              echo "Pages artifact indexed ($count) on attempt $i."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::Timed out waiting for artifact index; continuing to deploy-pages."

      - id: deploy
        uses: actions/deploy-pages@v4
